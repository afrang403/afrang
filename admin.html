<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>پنل مدیریت — لابراتوار عکس آفرنگ</title>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
:root{
  --bg:#1c1917;--surface:#292524;--surface2:#33302c;--border:#44403c;
  --text:#fafaf9;--muted:#a8a29e;--primary:#f59e0b;--primary-strong:#d97706;
  --grad:linear-gradient(135deg,#f59e0b,#fbbf24);
}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Vazirmatn',Tahoma,sans-serif;}
body{background:var(--bg);color:var(--text);min-height:100vh;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:1rem;}
.btn{cursor:pointer;border:none;border-radius:.75rem;padding:.65rem 1.2rem;font-size:.95rem;background:var(--grad);color:#1c1917;font-weight:700;font-family:inherit;transition:.2s;}
.btn:hover{filter:brightness(1.08);}
.btn-outline{border:1px solid var(--border);color:var(--text);background:transparent;font-weight:400;}
.btn-outline:hover{border-color:var(--primary);color:var(--primary);filter:none;}
.btn-danger{background:#dc2626;color:#fff;}
.input{background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:.6rem;padding:.55rem .8rem;width:100%;font-family:inherit;}
.input:focus{outline:2px solid var(--primary);}
main{max-width:1100px{width:100%;border-collapse:collapse;fontpx;}
.hidden{display:none !important;}
table{width:100%;border-collapse:collapse;font-size:.9rem;}
th,td{padding:10px 8px;border-bottom:1px solid var(--border);text-align:right;}
th{color:var(--muted);font-weight:600;}
.badge{padding:.15rem .6rem;border-radius:9999px;font-size:.75rem;background:var(--surface2);border:1px solid var(--border);}
.badge.pending{background:#92400e;color:#fde68a;}
.badge.done{background:#14532d;color:#bbf7d0;}
.table-wrap{overflow-x:auto;}
.msg{margin-top:10px;font-size:.9rem;}
a.dl{color:#60a5fa;text-decoration:underline;}
</style>
</head>
<body>

<!-- ===== LOGIN ===== -->
<div id="loginScreen" class="min-h-screen" style="display:flex;align-items:center;justify-content:center;padding:16px;">
  <div class="card" style="width:min(400px,92vw);padding:32px;text-align:center;">
    <div style="width:72px;height:72px;margin:0 auto 14px;border-radius:50%;background:var(--grad);color:#1c1917;display:flex;align-items:center;justify-content:center;font-size:1.8rem;">
      <i class="fa-solid fa-camera-retro"></i>
    </div>
    <h1 style="font-size:1.3rem;font-weight:800;">لابراتوار عکس آفرنگ</h1>
    <p style="color:var(--muted);font-size:.9rem;margin:4px 0 20px;">ورود به پنل مدیریت</p>
    <input type="password" id="adminPass" class="input" placeholder="رمز عبور" style="text-align:center;">
    <div class="msg" id="loginMsg" style="color:#f87171;"></div>
    <button class="btn" id="loginBtn" style="width:100%;margin-top:12px;">ورود</button>
  </div>
</div>

<!-- ===== DASHBOARD ===== -->
<div id="dashboard" class="hidden">
  <header style="background:var(--surface);border-bottom:1px solid var(--border);padding:14px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
    <div style="font-weight:800;">📷 پنل مدیریت — آفرنگ</div>
    <div>
      <button class="btn btn-outline" id="refreshBtn">🔄 بروزرسانی</button>
      <button class="btn btn-outline" id="logoutBtn">خروج</button>
    </div>
  </header>
  <main>
    <div class="card" style="padding:18px;">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px;">
        <h2 style="font-size:1.15rem;">📋 سفارش‌ها</h2>
        <input id="searchInput" class="input" placeholder="جستجو (نام، کد، شماره)..." style="max-width:280px;">
      </div>
      <div class="msg" id="listMsg" style="color:var(--muted);"></div>
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th>کد</th><th>نام</th><th>تلفن</th><th>کاغذ</th><th>اندازه</th><th>تعداد</th>
            <th>وضعیت</th><th>تاریخ</th><th>فایل</th><th></th>
          </tr></thead>
          <tbody id="ordersBody"><tr><td colspan="10" style="color:var(--muted)">در حال بارگذاری...</td></tr></tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbxv5kr2xC1-aEkn7RIQTbbmyw9ZouxHYCqBSUeHi2rS8wcUNdfYKNrU4djZY23vyydX/exec";
const ADMIN_PASS = "afrang1403";

const loginScreen = document.getElementById("loginScreen");
const dashboard = document.getElementById("dashboard");
let allOrders = [];

function showDash(){ loginScreen.style.display="none"; dashboard.classList.remove("hidden"); loadOrders(); }

// auto-login if session flag set
if(sessionStorage.getItem("afrangAdmin")==="1") showDash();

document.getElementById("loginBtn").addEventListener("click", tryLogin);
document.getElementById("adminPass").addEventListener("keydown", e=>{ if(e.key==="Enter") tryLogin(); });
function tryLogin(){
  const p = document.getElementById("adminPass").value;
  if(p === ADMIN_PASS){
    sessionStorage.setItem("afrangAdmin","1");
    document.getElementById("loginMsg").textContent="";
    showDash();
  }else{
    document.getElementById("loginMsg").textContent="رمز عبور اشتباه است.";
  }
}
document.getElementById("logoutBtn").addEventListener("click",()=>{
  sessionStorage.removeItem("afrangAdmin");
  location.reload();
});
document.getElementById("refreshBtn").addEventListener("click", loadOrders);

async function apiCall(payload){
  const res = await fetch(API_URL, {
    method:"POST",
    headers:{"Content-Type":"text/plain;charset=utf-8"},
    body: JSON.stringify(payload)
  });
  return res.json();
}

async function loadOrders(){
  const body = document.getElementById("ordersBody");
  const msg = document.getElementById("listMsg");
  msg.textContent در حال دریافت سفارش‌ها...";
‌ها...";
  try{
    const data = await apiCall({action:"getOrders", password:ADMIN_PASS});
    if(data.ok && Array.isArray(data.orders)){
      allOrders = data.orders;
      msg.textContent = "تعداد کل: " + allOrders.length;
      renderOrders(allOrders);
    }else{
      msg.textContent = "❌ خطا: " + (data.error||"دریافت سفارش‌ها ناموفق بود");
      body.innerHTML = "";
    }
  }catch(e){
    msg.textContent = "❌ خطا در اتصال: " + e.message;
  }
}

function renderOrders(list){
  const body = document.getElementById("ordersBody");
  if(!list.length){ body.innerHTML = '<tr><td colspan="10" style="color:var(--muted)">سفارشی یافت نشد.</td></tr>'; return; }
  body.innerHTML = "";
  list.forEach(o=>{
    const tr = document.createElement("tr");
    const date = o.createdAt ? new Date(o.createdAt).toLocaleString("fa-IR") : "—";
    tr.innerHTML =
      "<td><b>"+(o.code||"—")+"</b></td>"+
      "<td>"+esc(o.name||"")+"</td>"+
      "<td>"+esc(o.phone||"")+"</td>"+
      "<td>"+esc(o.paper||"")+"</td>"+
      "<td>"+esc(o.size||"")+"</td>"+
      "<td>"+(o.qty||1)+"</td>"+
      "<td><span class='badge "+(o.status==="done"?"done":"pending")+"'>"+esc(o.status||"pending")+"</span></td>"+
      "<td>"+date+"</td>"+
      "<td>"+(o.fileUrl ? "<a class='dl' href='"+o.fileUrl+"' target='_blank'>دانلود ⬇</a>" : "—")+"</td>"+
      "<td>"+(o.code ? "<button class='btn btn-outline' style='padding:.3rem .7rem;font-size:.8rem' data-del='"+o.code+"'>حذف</button>" : "")+"</td>";
    body.appendChild(tr);
  });
  body.querySelectorAll("[data-del]").forEach(b=>{
    b.addEventListener("click", async ()=>{
      if(!confirm("حذف سفارش "+b.dataset.del+"؟")) return;
      await apiCall({action:"deleteOrder", password:ADMIN_PASS, code:b.dataset.del});
      loadOrders();
    });
  });
}

document.getElementById("searchInput").addEventListener("input", e=>{
  const q = e.target.value.trim().toLowerCase();
  if(!q) return renderOrders(allOrders);
  renderOrders(allOrders.filter(o=>
    (o.code||"").toLowerCase().includes(q) ||
    (o.name||"").toLowerCase().includes(q) ||
    (o.phone||"").includes(q)));
});

function esc(s){ return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
</script>
</body>
</html>
