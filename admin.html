<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>پنل مدیریت — لابراتوار عکس آفرنگ</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
<style>
  body{font-family:'Vazirmatn',Tahoma,sans-serif;}
  /* Theme: Warm Gold/Amber (default) */
  :root{
    --bg:#1c1917; --surface:#292524; --surface2:#33302c; --border:#44403c;
    --text:#fafaf9; --muted:#a8a29e;
    --primary:#f59e0b; --primary-strong:#d97706;
    --grad:linear-gradient(135deg,#f59e0b,#fbbf24);
  }
  /* Theme: Blue/Dark */
  body.theme-blue{
    --bg:#0b1220; --surface:#111a2e; --surface2:#18243d; --border:#24365a;
    --text:#e8eefc; --muted:#8fa3c8;
    --primary:#3b82f6; --primary-strong:#2563eb;
    --grad:linear-gradient(135deg,#2563eb,#60a5fa);
  }
  body{background:var(--bg);color:var(--text);transition:background .3s,color .3s;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:1rem;}
  .btn-gold{background:var(--grad);font-weight:700;border-radius:.75rem;}
  body.theme-blue .btn-gold{color:#fff;}
  .btn-gold:hover{filter:brightness(1.08);}
  .btn-outline{border:1px solid var(--border);color:var(--text);background:transparent;border-radius:.75rem;}
  .btn-outline:hover{border-color:var(--primary);color:var(--primary);}
  .input{background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:.6rem;padding:.55rem .8rem;width:100%;}
  .input:focus{outline:2px solid var(--primary);}
  .tab-active{background:var(--grad);font-weight:700;color:#1c1917;}
  body.theme-blue .tab-active{color:#fff;}
  .badge{padding:.15rem .6rem;border-radius:9999px;font-size:.75rem;background:var(--surface2);border:1px solid var(--border);}
  ::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px}
</style>
</head>
<body class="min-h-screen">

<!-- ================= LOGIN ================= -->
<div id="loginScreen" class="min-h-screen flex items-center justify-center p-4">
  <div class="card w-full max-w-md p-8 shadow-2xl">
    <div class="text-center mb-6">
      <div class="w-20 h-20 mx-auto rounded-full flex items-center justify-center text-3xl mb-3" style="background:var(--grad);color:#1c1917">
        <i class="fa-solid fa-camera-retro"></i>
      </div>
      <h1 class="text-2xl font-bold">لابراتوار عکس آفرنگ</h1>
      <p class="text-sm mt-1" style="color:var(--muted)">ورود به پنل مدیریت</p>
    </div>
    <label class="text-sm mb-1 block"><i class="fa-solid fa-lock ml-1"></i>رمز عبور</label>
    <input type="password" id="adminPass" class="input mb-3" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()">
    <button onclick="doLogin()" class="btn-gold w-full py-2.5 rounded-xl transition"><i class="fa-solid fa-right-to-bracket ml-1"></i>ورود</button>
    <div id="loginMsg" class="text-red-400 text-sm mt-3 text-center"></div>
    <div class="text-center mt-5">
      <a href="index.html" class="btn-outline inline-block px-4 py-2 rounded-xl text-sm"><i class="fa-solid fa-arrow-right ml-1"></i>بازگشت به سایت</a>
    </div>
  </div>
</div>

<!-- ================= DASHBOARD ================= -->
<div id="dashboard" class="hidden min-h-screen flex flex-col">
  <header class="card sticky top-0 z-40 !rounded-none border-x-0 border-t-0 px-4 py-3 flex items-center gap-3 flex-wrap">
    <div class="w-10 h-10 rounded-full flex items-center justify-center text-lg" style="background:var(--grad);color:#1c1917">
      <i class="fa-solid fa-camera-retro"></i>
    </div>
    <div>
      <h1 class="font-bold leading-tight">پنل مدیریت آفرنگ</h1>
      <p class="text-xs" style="color:var(--muted)">لابراتوار عکس آفرنگ</p>
    </div>
    <div class="flex gap-2 text-xs mr-auto flex-wrap items-center">
      <span class="badge">🧾 سفارش‌ها: <b id="statOrders">—</b></span>
      <span class="badge">🖼️ نمونه‌کار: <b id="statGallery">—</b></span>
      <span class="badge">💬 پیام‌ها: <b id="statMessages">—</b></span>
      <button id="themeBtn" class="btn-outline px-3 py-1.5 rounded-lg" title="تغییر تم"><i class="fa-solid fa-palette"></i> تم</button>
      <a href="index.html" class="btn-outline px-3 py-1.5 rounded-lg"><i class="fa-solid fa-house ml-1"></i>سایت</a>
      <button onclick="doLogout()" class="px-3 py-1.5 rounded-lg text-white" style="background:#dc2626"><i class="fa-solid fa-right-from-bracket ml-1"></i>خروج</button>
    </div>
  </header>

  <div class="flex flex-1 flex-col lg:flex-row">
    <aside class="lg:w-60 p-4 flex lg:flex-col gap-2 lg:sticky lg:top-[72px] lg:self-start overflow-x-auto">
      <button class="tab-btn tab-active flex items-center gap-2 px-4 py-2.5 rounded-xl whitespace-nowrap transition" data-tab="orders"><i class="fa-regular fa-clipboard"></i>📋 سفارش‌ها</button>
      <button class="tab-btn btn-outline flex items-center gap-2 px-4 py-2.5 rounded-xl whitespace-nowrap transition" data-tab="gallery"><i class="fa-regular fa-images"></i>🖼️ گالری نمونه‌کارها</button>
      <button class="tab-btn btn-outline flex items-center gap-2 px-4 py-2.5 rounded-xl whitespace-nowrap transition" data-tab="messages"><i class="fa-regular fa-comment-dots"></i>💬 پیام‌های دریافتی</button>
      <button class="tab-btn btn-outline flex items-center gap-2 px-4 py-2.5 rounded-xl whitespace-nowrap transition" data-tab="settings"><i class="fa-solid fa-gear"></i>⚙️ تنظیمات لابراتوار</button>
      <div id="dbMode" class="text-xs lg:mt-auto" style="color:var(--muted)"></div>
    </aside>

    <main class="flex-1 p-4 lg:p-6 space-y-6">

      <!-- Orders -->
      <section id="tab-orders" class="tab-panel">
        <h2 class="text-xl font-bold mb-4"><i class="fa-regular fa-clipboard ml-1"></i>سفارش‌ها</h2>
        <div class="flex gap-2 mb-4 flex-wrap">
          <button class="filter-btn tab-active px-4 py-1.5 rounded-lg text-sm" data-f="all">همه</button>
          <button class="filter-btn btn-outline px-4 py-1.5 rounded-lg text-sm" data-f="pending">در انتظار</button>
          <button class="filter-btn btn-outline px-4 py-1.5 rounded-lg text-sm" data-f="processing">در حال چاپ</button>
          <button class="filter-btn btn-outline px-4 py-1.5 rounded-lg text-sm" data-f="done">تحویل شده</button>
        </div>
        <div id="ordersList" class="grid gap-4 md:grid-cols-2 xl:grid-cols-3"></div>
      </section>

      <!-- Gallery -->
      <section id="tab-gallery" class="tab-panel hidden">
        <h2 class="text-xl font-bold mb-4"><i class="fa-regular fa-images ml-1"></i>گالری نمونه‌کارها</h2>
        <div class="card p-5 mb-5">
          <div class="grid md:grid-cols-3 gap-3">
            <input id="gTitle" class="input" placeholder="عنوان عکس">
            <input id="gCat" class="input" placeholder="دسته‌بندی (مثلاً پرتره)">
            <input id="gFile" type="file" accept="image/*" class="input py-1.5">
          </div>
          <button onclick="addGalleryItem()" class="btn-gold px-6 py-2 mt-3"><i class="fa-solid fa-cloud-arrow-up ml-1"></i>افزودن به گالری</button>
          <div id="galleryMsg" class="text-sm mt-2"></div>
        </div>
        <div id="galleryGrid" class="grid gap-4 sm:grid-cols-2 md:grid-cols-3 xl:grid-cols-4"></div>
      </section>

      <!-- Messages -->
      <section id="tab-messages" class="tab-panel hidden">
        <h2 class="text-xl font-bold mb-4"><i class="fa-regular fa-comment-dots ml-1"></i>پیام‌های دریافتی</h2>
        <div id="messagesList" class="space-y-3"></div>
      </section>

      <!-- Settings -->
      <section id="tab-settings" class="tab-panel hidden">
        <h2 class="text-xl font-bold mb-4"><i class="fa-solid fa-gear ml-1"></i>اطلاعات و تنظیمات لابراتوار</h2>
        <div class="card p-5 space-y-4 max-w-xl">
          <div><label class="text-sm">☎️ تلفن‌های لابراتوار</label><input id="setPhones" class="input mt-1" placeholder="03132312375, ..."></div>
          <div><label class="text-sm">📱 تلفن مدیران</label><input id="setManagers" class="input mt-1" placeholder="09133118039, 09131088114"></div>
          <div><label class="text-sm">🟢 آیدی روبیکا</label><input id="setRubika" class="input mt-1" placeholder="@Afranglab"></div>
          <div><label class="text-sm">✈️ آیدی تلگرام</label><input id="setTelegram" class="input mt-1" placeholder="@Afranglab"></div>
          <div><label class="text-sm">🟣 آیدی ایتا</label><input id="setEitaa" class="input mt-1" placeholder="@Afranglab"></div>
          <button onclick="saveSettings()" class="btn-gold px-6 py-2"><i class="fa-solid fa-floppy-disk ml-1"></i>ذخیره تنظیمات</button>
          <div id="setMsg" class="text-sm text-green-400"></div>
        </div>
      </section>

    </main>
  </div>
</div>

<script>
/* ===== Config ===== */
const ADMIN_PASS = "afrang1403";
const firebaseConfig = {
  apiKey: "AIzaSyPLACEHOLDER-REPLACE-ME",
  authDomain: "afrang-5aa57.firebaseapp.com",
  projectId: "afrang-5aa57",
  storageBucket: "afrang-5aa57.appspot.com",
  messagingSenderId: "000000000000",
  appId: "1:000000000000:web:placeholder"
};

/* ===== Data layer: Firebase with offline mock fallback ===== */
let db=null, storage=null, MODE="offline";
let MOCK = {
  orders:[
    {id:"AFR-1001", name:"علی رضایی", phone:"09131234567", service:"چاپ لاستر", paper:"Luster", size:"10x15", qty:24, status:"pending", price:"", fileName:"order-1001.jpg", fileUrl:"", createdAt:Date.now()-86400000},
    {id:"AFR-1002", name:"مریم احمدی", phone:"09139876543", service:"چاپ متالیک", paper:"Metallic", size:"20x30", qty:5, status:"processing", price:"450000", fileName:"wedding.jpg", fileUrl:"", createdAt:Date.now()-3600000}
  ],
  gallery:[
    {id:"G1", title:"پرتره کلاسیک", cat:"پرتره", url:""},
    {id:"G2", title:"طبیعت", cat:"منظره", url:""}
  ],
  messages:[
    {id:"M1", name:"حسین ک.", phone:"09131112233", text:"سلام، چاپ فوری دارید؟", createdAt:Date.now()-7200000}
  ],
  settings:{phones:"03132312375", managers:"09133118039, 09131088114", rubika:"@Afranglab", telegram:"@Afranglab", eitaa:"@Afranglab"}
};
function tryInitFirebase(){
  try{ firebase.initializeApp(firebaseConfig); db=firebase.firestore(); storage=firebase.storage(); MODE="online"; }
  catch(e){ MODE="offline"; }
}
tryInitFirebase();
async function dbGetAll(col){
  if(MODE==="online"){ try{ const s=await db.collection(col).get(); return s.docs.map(d=>({id:d.id,...d.data()})); }catch(e){} }
  return (MOCK[col]||[]).slice();
}
async function dbAdd(col,data){
  if(MODE==="online"){ try{ const r=await db.collection(col).add(data); return r.id; }catch(e){} }
  const id="m-"+Date.now(); (MOCK[col]=MOCK[col]||[]).unshift({id,...data}); return id;
}
async function dbUpdate(col,id,data){
  if(MODE==="online"){ try{ await db.collection(col).doc(id).update(data); return; }catch(e){} }
  const a=MOCK[col]||[]; const i=a.findIndex(x=>x.id===id); if(i>-1)a[i]={...a[i],...data};
}
async function dbDelete(col,id){
  if(MODE==="online"){ try{ await db.collection(col).doc(id).delete(); }catch(e){} }
  MOCK[col]=(MOCK[col]||[]).filter(x=>x.id!==id);
}
async function dbGetDoc(col,id){
  if(MODE==="online"){ try{ const d=await db.collection(col).doc(id).get(); if(d.exists) return {id,...d.data()}; }catch(e){} }
  return (MOCK[col]||[]).find(x=>x.id===id)||null;
}

/* ===== Theme toggle ===== */
function applyTheme(t){
  document.body.classList.toggle("theme-blue", t==="blue");
  localStorage.setItem("afrang_admin_theme", t);
}
applyTheme(localStorage.getItem("afrang_admin_theme")||"gold");
document.getElementById("themeBtn").addEventListener("click",()=>{
  applyTheme(document.body.classList.contains("theme-blue")?"gold":"blue");
});

/* ===== Auth ===== */
function doLogin(){
  if(document.getElementById("adminPass").value===ADMIN_PASS){
    sessionStorage.setItem("afrang_admin","1");
    enterDashboard();
  }else{
    document.getElementById("loginMsg").textContent="رمز عبور اشتباه است!";
  }
}
function doLogout(){ sessionStorage.removeItem("afrang_admin"); location.reload(); }
function enterDashboard(){
  document.getElementById("loginScreen").classList.add("hidden");
  document.getElementById("dashboard").classList.remove("hidden");
  showTab("orders");
}
if(sessionStorage.getItem("afrang_admin")==="1") enterDashboard();

/* ===== Tabs ===== */
document.querySelectorAll(".tab-btn").forEach(b=>b.addEventListener("click",()=>showTab(b.dataset.tab)));
function showTab(name){
  document.querySelectorAll(".tab-panel").forEach(p=>p.classList.add("hidden"));
  document.getElementById("tab-"+name).classList.remove("hidden");
  document.querySelectorAll(".tab-btn").forEach(b=>{
    b.classList.toggle("tab-active", b.dataset.tab===name);
    b.classList.toggle("btn-outline", b.dataset.tab!==name);
  });
  if(name==="orders") loadOrders();
  if(name==="gallery") loadGallery();
  if(name==="messages") loadMessages();
  if(name==="settings") loadSettings();
}

/* ===== Orders ===== */
let ordersCache=[], orderFilter="all";
document.querySelectorAll(".filter-btn").forEach(b=>b.addEventListener("click",()=>{
  orderFilter=b.dataset.f;
  document.querySelectorAll(".filter-btn").forEach(x=>{
    x.classList.toggle("tab-active",x===b); x.classList.toggle("btn-outline",x!==b);
  });
  renderOrders();
}));
const STATUS_FA={pending:"در انتظار",processing:"در حال چاپ",done:"تحویل شده"};
async function loadOrders(){
  ordersCache=await dbGetAll("orders");
  document.getElementById("statOrders").textContent=ordersCache.length;
  document.getElementById("dbMode").textContent = MODE==="online" ? "🟢 متصل به Firebase" : "⚪ حالت آفلاین (داده‌های نمونه)";
  renderOrders();
}
function renderOrders(){
  const list=document.getElementById("ordersList");
  const rows=ordersCache.filter(o=>orderFilter==="all"||(o.status||"pending")===orderFilter);
  if(!rows.length){ list.innerHTML='<p style="color:var(--muted)">سفارشی یافت نشد.</p>'; return; }
  list.innerHTML=rows.map(o=>`
    <div class="card p-4 space-y-2">
      <div class="flex justify-between items-center">
        <b>${o.name||"—"}</b>
        <span class="badge">${o.id||""}</span>
      </div>
      <div class="text-sm space-y-1" style="color:var(--muted)">
        <div><i class="fa-solid fa-phone ml-1"></i>${o.phone||"—"}</div>
        <div><i class="fa-solid fa-print ml-1"></i>${o.service||o.paper||"—"} — ${o.size||""} × ${o.qty||0} عدد</div>
        ${o.fileName?`<div><i class="fa-solid fa-image ml-1"></i>${o.fileName}</div>`:""}
      </div>
      ${o.fileUrl
        ?`<a href="${o.fileUrl}" download class="btn-outline inline-block px-3 py-1.5 text-sm"><i class="fa-solid fa-download ml-1"></i>دانلود عکس مشتری</a>`
        :`<span class="btn-outline inline-block px-3 py-1.5 text-sm opacity-50"><i class="fa-solid fa-download ml-1"></i>عکس (فقط آنلاین)</span>`}
      <div class="grid grid-cols-2 gap-2 pt-2">
        <select onchange="updateOrder('${o.id}','status',this.value)" class="input text-sm">
          ${Object.keys(STATUS_FA).map(s=>`<option value="${s}" ${(o.status||"pending")===s?"selected":""}>${STATUS_FA[s]}</option>`).join("")}
        </select>
        <input type="number" class="input text-sm" placeholder="قیمت (تومان)" value="${o.price||""}" onchange="updateOrder('${o.id}','price',this.value)">
      </div>
    </div>`).join("");
}
function updateOrder(id,field,value){ dbUpdate("orders",id,{[field]:value}); }

/* ===== Gallery ===== */
async function loadGallery(){
  const items=await dbGetAll("gallery");
  document.getElementById("statGallery").textContent=items.length;
  const g=document.getElementById("galleryGrid");
  if(!items.length){ g.innerHTML='<p style="color:var(--muted)">هنوز عکسی اضافه نشده است.</p>'; return; }
  g.innerHTML=items.map(it=>`
    <div class="card overflow-hidden">
      ${it.url?`<img src="${it.url}" class="w-full h-40 object-cover" alt="${it.title||""}">`
             :`<div class="w-full h-40 flex items-center justify-center text-3xl" style="background:var(--surface2)"><i class="fa-regular fa-image"></i></div>`}
      <div class="p-3 flex justify-between items-center">
        <div><b class="text-sm">${it.title||"بدون عنوان"}</b><div class="text-xs" style="color:var(--muted)">${it.cat||""}</div></div>
        <button onclick="delGallery('${it.id}')" class="text-red-400 hover:text-red-300"><i class="fa-solid fa-trash"></i></button>
      </div>
    </div>`).join("");
}
async function addGalleryItem(){
  const msg=document.getElementById("galleryMsg");
  const title=document.getElementById("gTitle").value.trim();
  const cat=document.getElementById("gCat").value.trim();
  const file=document.getElementById("gFile").files[0];
  if(!title||!file){ msg.style.color="#f87171"; msg.textContent="عنوان و فایل عکس الزامی است."; return; }
  msg.style.color="var(--muted)"; msg.textContent="در حال بارگذاری...";
  let url="";
  if(MODE==="online" && storage){
    try{
      const ref=storage.ref().child("gallery/"+Date.now()+"_"+file.name);
      await ref.put(file); url=await ref.getDownloadURL();
    }catch(e){ url=""; }
  }
  if(!url) url=URL.createObjectURL(file); /* offline preview */
  await dbAdd("gallery",{title,cat,url,createdAt:Date.now()});
  document.getElementById("gTitle").value=""; document.getElementById("gCat").value=""; document.getElementById("gFile").value="";
  msg.style.color="#34d399"; msg.textContent="با موفقیت اضافه شد ✅";
  loadGallery();
}
function delGallery(id){ dbDelete("gallery",id).then(loadGallery); }

/* ===== Messages ===== */
async function loadMessages(){
  const items=await dbGetAll("messages");
  document.getElementById("statMessages").textContent=items.length;
  const l=document.getElementById("messagesList");
  if(!items.length){ l.innerHTML='<p style="color:var(--muted)">پیامی دریافت نشده است.</p>'; return; }
  l.innerHTML=items.map(m=>`
    <div class="card p-4">
      <div class="flex justify-between flex-wrap gap-2">
        <b>${m.name||"—"}</b>
        <span class="text-xs" style="color:var(--muted)">${new Date(m.createdAt||Date.now()).toLocaleString("fa-IR")}</span>
      </div>
      <div class="text-sm mt-1"><i class="fa-solid fa-phone ml-1"></i>${m.phone||"—"}</div>
      <p class="mt-2 text-sm">${m.text||""}</p>
    </div>`).join("");
}

/* ===== Settings ===== */
async function loadSettings(){
  let s=await dbGetDoc("settings","lab");
  if(!s) s=MOCK.settings;
  document.getElementById("setPhones").value=s.phones||"";
  document.getElementById("setManagers").value=s.managers||"";
  document.getElementById("setRubika").value=s.rubika||"";
  document.getElementById("setTelegram").value=s.telegram||"";
  document.getElementById("setEitaa").value=s.eitaa||"";
}
async function saveSettings(){
  const data={
    phones:document.getElementById("setPhones").value,
    managers:document.getElementById("setManagers").value,
    rubika:document.getElementById("setRubika").value,
    telegram:document.getElementById("setTelegram").value,
    eitaa:document.getElementById("setEitaa").value
  };
  await dbUpdate("settings","lab",data);
  if(MODE==="offline") MOCK.settings=data;
  document.getElementById("setMsg").textContent="ذخیره شد ✅";
  setTimeout(()=>document.getElementById("setMsg").textContent="",2500);
}
</script>
</body>
</html>
